# ---------------------------------------------------------------------------
# vehicle-service - centralized configuration
# ---------------------------------------------------------------------------

spring:
  application:
    name: vehicle-service
  datasource:
    # Sensitive values come from environment variables; defaults are local-only
    # placeholders and must be overridden outside source control.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${VEHICLE_DB_NAME:vehicle_db}
    username: ${VEHICLE_DB_USERNAME:vehicle_service}
    password: ${VEHICLE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    # Dev-friendly schema management: Hibernate creates/updates tables from the
    # entities. Production deployments should migrate to explicit Flyway/Liquibase
    # migrations instead.
    hibernate:
      ddl-auto: update

server:
  port: ${VEHICLE_SERVICE_PORT:8082}
