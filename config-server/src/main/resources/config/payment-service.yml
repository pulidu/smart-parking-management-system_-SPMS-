# ---------------------------------------------------------------------------
# payment-service - centralized configuration
# ---------------------------------------------------------------------------

spring:
  application:
    name: payment-service
  datasource:
    # Sensitive values come from environment variables; defaults are local-only
    # placeholders and must be overridden outside source control.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PAYMENT_DB_NAME:payment_db}
    username: ${PAYMENT_DB_USERNAME:payment_service}
    password: ${PAYMENT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    # Dev-friendly schema management: Hibernate creates/updates tables from the
    # entities. Production deployments should migrate to explicit Flyway/Liquibase
    # migrations instead.
    hibernate:
      ddl-auto: update

server:
  port: ${PAYMENT_SERVICE_PORT:8084}

payment-service:
  # Verify that a reservation exists by calling the parking service before
  # recording a payment. Set to false to run the payment service standalone.
  verify-reservation: true
  # Where to reach the parking service for reservation verification.
  parking-service-url: ${PARKING_SERVICE_URL:http://localhost:8083}
  # Card number that the MOCK gateway always declines (deterministic FAILED).
  mock-failed-card: ${MOCK_FAILED_CARD:4000000000000002}
