# ---------------------------------------------------------------------------
# payment-service - centralized configuration
# ---------------------------------------------------------------------------

spring:
  application:
    name: payment-service
  datasource:
    # Sensitive values come from environment variables; defaults are local-only
    # placeholders and must be overridden outside source control.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PAYMENT_DB_NAME:payment_db}
    username: ${PAYMENT_DB_USERNAME:payment_service}
    password: ${PAYMENT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false

server:
  port: ${PAYMENT_SERVICE_PORT:8084}
