# ---------------------------------------------------------------------------
# payment-service - centralized configuration
# ---------------------------------------------------------------------------

spring:
  application:
    name: payment-service
  datasource:
    # All SPMS services share one PostgreSQL database (smart_parking_db) for
    # local coursework. Values default to the local setup and can be overridden
    # via environment variables if needed.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_parking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2002}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    # Dev-friendly schema management: Hibernate creates/updates tables from the
    # entities. Production deployments should migrate to explicit Flyway/Liquibase
    # migrations instead.
    hibernate:
      ddl-auto: update

server:
  port: ${PAYMENT_SERVICE_PORT:8084}

payment-service:
  # Verify that a reservation exists by calling the parking service before
  # recording a payment. The parking service is resolved through Eureka service
  # discovery (lb://PARKING-SERVICE) at runtime - no host/port is configured.
  # Set to false to run the payment service standalone.
  verify-reservation: true
  # Client timeouts for the load-balanced inter-service RestClient (ms).
  client:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  # Card number that the MOCK gateway always declines (deterministic FAILED).
  mock-failed-card: ${MOCK_FAILED_CARD:4000000000000002}
