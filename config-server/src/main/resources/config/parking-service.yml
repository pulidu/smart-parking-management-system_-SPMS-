# ---------------------------------------------------------------------------
# parking-service - centralized configuration
# ---------------------------------------------------------------------------

spring:
  application:
    name: parking-service
  datasource:
    # All SPMS services share one PostgreSQL database (smart_parking_db) for
    # local coursework. Values default to the local setup and can be overridden
    # via environment variables if needed.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_parking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2002}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    # Dev-friendly schema management: Hibernate creates/updates tables from the
    # entities. Production deployments should migrate to explicit Flyway/Liquibase
    # migrations instead.
    hibernate:
      ddl-auto: update

server:
  port: ${PARKING_SERVICE_PORT:8083}
