# ---------------------------------------------------------------------------
# Config Server configuration
# ---------------------------------------------------------------------------

# Port on which the Config Server serves configuration
server.port=8888

# Logical name used to identify this service (in Eureka)
spring.application.name=config-server

# Use the native (local classpath) configuration repository so the coursework
# runs locally without depending on GitHub or any external VCS
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config

# Register this server with the Eureka registry (discovery-first clients can
# resolve the config server by its application name instead of a hard-coded URL)
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Expose health and info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
