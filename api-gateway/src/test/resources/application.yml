# ---------------------------------------------------------------------------
# api-gateway test configuration
# ---------------------------------------------------------------------------
# Hermetic test setup: the tests boot the gateway on a random port WITHOUT
# contacting the Config Server or Eureka, and define the same route table
# inline so routing behavior can be verified in isolation.

spring:
  application:
    name: api-gateway
  # Clear the config-server import from the main application.yml so tests do
  # not depend on a running Config Server.
  config:
    import:
  cloud:
    config:
      # The config-client's import check requires a "configserver:" import; the
      # tests deliberately have none, so disable the check.
      import-check:
        enabled: false

    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: vehicle-service
              uri: lb://VEHICLE-SERVICE
              predicates:
                - Path=/api/vehicles/**

            - id: parking-service
              uri: lb://PARKING-SERVICE
              predicates:
                - Path=/api/parking/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**

server:
  port: 0

# Do not register with / fetch from Eureka during tests.
eureka:
  client:
    enabled: false

# Expose the gateway actuator endpoint so tests can assert the active routes.
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
