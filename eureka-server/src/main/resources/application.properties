# ---------------------------------------------------------------------------
# Eureka Server configuration
# ---------------------------------------------------------------------------

# Eureka dashboard / API port
server.port=8761

# Logical name used by clients to identify this service
spring.application.name=eureka-server

# Standalone Eureka server: never register itself with Eureka
eureka.client.register-with-eureka=false

# Standalone Eureka server: do not fetch the registry from any peer
eureka.client.fetch-registry=false

# Hostname advertised in the dashboard and to clients
eureka.instance.hostname=localhost

# Skip the initial peer-sync wait when starting in standalone mode
eureka.server.wait-time-in-ms-when-sync-empty=0

# Disable self-preservation in local/dev so evicted instances are removed promptly
eureka.server.enable-self-preservation=false

# Expose health and info endpoints used by gateway / other services
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
