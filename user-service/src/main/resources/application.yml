# ---------------------------------------------------------------------------
# user-service - local bootstrap configuration
# ---------------------------------------------------------------------------
# The service keeps only what it needs to boot and locate its centralized
# configuration. The datasource (PostgreSQL), JPA settings, server port, Eureka
# registration and management endpoints come from the Config Server
# (config/user-service.yml merged with config/application.yml).
#
# Database connection settings are served by the Config Server and default to
# the shared local database (smart_parking_db, user postgres). They can be
# overridden through the DB_HOST, DB_PORT, DB_NAME, DB_USERNAME and DB_PASSWORD
# environment variables at runtime.

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server:
  port: ${USER_SERVICE_PORT:8081}

# Expose health (used by the gateway / Eureka).
management:
  endpoints:
    web:
      exposure:
        include: health,info
